  <style>
    :root{--font-size:14px;--background:#fafafa;--foreground:#1a1a1a;--card:#ffffff;--card-foreground:#1a1a1a;--popover:#ffffff;--popover-foreground:#1a1a1a;--primary:#2c3e50;--primary-foreground:#ffffff;--secondary:#f8f9fa;--secondary-foreground:#2c3e50;--muted:#f1f5f9;--muted-foreground:#64748b;--accent:#e2e8f0;--accent-foreground:#2c3e50;--destructive:#dc2626;--destructive-foreground:#ffffff;--border:rgba(0,0,0,.08);--input:transparent;--input-background:#f8fafc;--switch-background:#cbd5e1;--ring:#3b82f6;--radius:.625rem;--primary-soft:linear-gradient(135deg,#0ea5e9 0%,#0369a1 100%);--primary-soft-hover:linear-gradient(135deg,#0284c7 0%,#075985 100%);--success-soft:linear-gradient(135deg,#0ea5e9 0%,#0369a1 100%);--success-soft-hover:linear-gradient(135deg,#0284c7 0%,#075985 100%);--warning-soft:linear-gradient(135deg,#d97706 0%,#b45309 100%);--warning-soft-hover:linear-gradient(135deg,#b45309 0%,#92400e 100%);--danger-soft:linear-gradient(135deg,#dc2626 0%,#b91c1c 100%);--danger-soft-hover:linear-gradient(135deg,#ef4444 0%,#dc2626 100%);--neutral-soft:linear-gradient(135deg,#6b7280 0%,#4b5563 100%)}
    .dark{--background:#0f172a;--foreground:#f8fafc;--card:#1e293b;--card-foreground:#f8fafc;--popover:#1e293b;--popover-foreground:#f8fafc;--primary:#f8fafc;--primary-foreground:#1e293b;--secondary:#334155;--secondary-foreground:#f8fafc;--muted:#334155;--muted-foreground:#a3b3c8;--accent:#475569;--accent-foreground:#f8fafc;--destructive:#ef4444;--destructive-foreground:#f8fafc;--border:rgba(255,255,255,.08);--input:#334155;--ring:#06b6d4;--input-background:#0b1325;--primary-soft:linear-gradient(135deg,#22d3ee 0%,#06b6d4 100%);--primary-soft-hover:linear-gradient(135deg,#06b6d4 0%,#0891b2 100%);--success-soft:linear-gradient(135deg,#22d3ee 0%,#06b6d4 100%);--success-soft-hover:linear-gradient(135deg,#06b6d4 0%,#0891b2 100%);--warning-soft:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);--warning-soft-hover:linear-gradient(135deg,#d97706 0%,#b45309 100%);--danger-soft:linear-gradient(135deg,#f87171 0%,#ef4444 100%);--danger-soft-hover:linear-gradient(135deg,#ef4444 0%,#dc2626 100%);--neutral-soft:linear-gradient(135deg,#9ca3af 0%,#6b7280 100%)}
    body{background:var(--background);color:var(--foreground);font-size:var(--font-size);line-height:1.6}
    .card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06)}
    .btn-primary{background:var(--primary-soft);color:#fff;border:none;transition:.2s;font-weight:500}
    .btn-primary:hover{background:var(--primary-soft-hover);box-shadow:0 2px 6px rgba(0,0,0,.12)}
    .btn-success{background:var(--success-soft);color:#fff;border:none;transition:.2s;font-weight:500}
    .btn-success:hover{background:var(--success-soft-hover);box-shadow:0 2px 6px rgba(16,185,129,.25)}
    .btn-warning{background:var(--warning-soft);color:#fff;border:none;transition:.2s;font-weight:500}
    .btn-warning:hover{background:var(--warning-soft-hover);box-shadow:0 2px 6px rgba(217,119,6,.25)}
    .btn-danger{background:var(--danger-soft);color:#fff;border:none;transition:.2s;font-weight:500}
    .btn-danger:hover{background:var(--danger-soft-hover);box-shadow:0 2px 6px rgba(220,38,38,.25)}
    .btn-ghost{background:transparent;color:var(--foreground);border:1px solid var(--border);transition:.2s}
    .btn-ghost:hover{background:var(--accent);color:var(--accent-foreground);border-color:var(--border)}
    .btn-outline{background:transparent;color:var(--foreground);border:1px solid var(--border);transition:.2s}
    .btn-outline:hover{background:var(--muted);border-color:var(--border)}
    .input{background:var(--input-background);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:.75rem;color:var(--foreground);transition:.2s}
    .textarea{background:var(--input-background);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:.75rem;color:var(--foreground);transition:.2s;min-height:80px}
    .badge{background:var(--secondary);color:var(--secondary-foreground);border-radius:calc(var(--radius) - 4px);padding:.25rem .75rem;font-size:.75rem;font-weight:500;border:1px solid var(--border)}
    .progress-container{width:100%;height:10px;background:color-mix(in srgb, var(--foreground) 11%, transparent);border-radius:9999px;overflow:hidden}
    .set-pips{display:flex;gap:4px;width:100%}
    .set-pips span{flex:1 1 0;height:10px;min-width:0;border-radius:5px;background:color-mix(in srgb, var(--foreground) 13%, transparent);transition:background .2s ease}
    .set-pips span.on{background:var(--success-soft)}   /* same blue/cyan gradient the progress bar always used */
    .progress-bar{height:100%;background:var(--success-soft);border-radius:9999px;transition:width .3s ease}
    .tabs-list{background:var(--muted);border-radius:calc(var(--radius) + 6px);padding:.35rem;border:1px solid var(--border);box-shadow:0 1px 0 rgba(0,0,0,.02);display:inline-flex;align-items:center;gap:.25rem}
    .tab-trigger{display:inline-flex;align-items:center;gap:.5rem;height:42px;padding:0 .95rem;border-radius:calc(var(--radius) - 2px);font-weight:600;letter-spacing:.1px;color:var(--foreground);border:none;background:transparent}
    .tab-trigger .icon-primary{color:color-mix(in srgb, var(--foreground) 55%, transparent);opacity:.8;transition:color .15s ease, opacity .15s ease}
    .tab-trigger:hover{background:color-mix(in srgb, var(--muted) 70%, transparent)}
    .tab-trigger.active{background:var(--primary-soft);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
    .tab-trigger.active .icon-primary{color:#fff;opacity:.95}
    .select-trigger{background:var(--input-background);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:.5rem 1rem;transition:.2s}
    .switch{position:relative;display:inline-block;width:44px;height:24px}
    .switch input{opacity:0;width:0;height:0}
    .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--switch-background);transition:.3s;border-radius:24px}
    .slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.2)}
    input:checked + .slider{background:var(--success-soft)}
    input:checked + .slider:before{transform:translateX(20px)}
    .hover-lift{transition:.2s}
    .hover-lift:hover{box-shadow:0 6px 16px rgba(0,0,0,.12)}

    .seg{display:inline-flex;align-items:center;gap:2px;padding:3px;background:var(--muted);border:1px solid var(--border);border-radius:calc(var(--radius) - 1px)}
    .seg button{height:26px;padding:0 .85rem;font-size:.75rem;font-weight:600;letter-spacing:.1px;border-radius:calc(var(--radius) - 4px);color:var(--muted-foreground);background:transparent;border:none;cursor:pointer;transition:background .15s ease,color .15s ease,box-shadow .15s ease}
    .seg button:hover{color:var(--foreground)}
    .seg button.on{background:var(--primary-soft);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}
    .table{width:100%;border-collapse:separate;border-spacing:0}
    .table th,.table td{padding:.65rem .75rem;border-bottom:1px solid var(--border)}
    .table th{font-weight:600;color:var(--muted-foreground);text-align:left}
    .table tr:last-child td{border-bottom:none}
    .link{color:#0ea5e9}
    html.dark .link{color:#7dd3fc}
    .week-strip{display:flex;align-items:center;gap:.35rem}
    .day-pill{min-width:34px;height:30px;padding:0 .5rem;border-radius:999px;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:.8rem;opacity:.9;cursor:pointer;user-select:none;background:var(--card)}
    .day-pill:hover{opacity:1}
    .day-pill.rest{opacity:.6}
    .day-pill.train{background:rgba(8,145,178,.12);border-color:rgba(8,145,178,.35);color:#0b7285}
    html.dark .day-pill.train{background:rgba(34,211,238,.15);border-color:rgba(34,211,238,.45);color:#67e8f9}
    .day-pill.today{box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 25%, transparent)}

    html.dark .day-pill .dot{background:#22d3ee}

    .app-logo.soft{background:var(--primary-soft); color:#fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);}
    .dark .app-logo.soft{box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);}
    .app-logo.solid{background:#06b6d4; color:#fff; box-shadow:0 1px 2px rgba(0,0,0,.12), inset 0 0 0 1px rgba(255,255,255,.14);}
    .dark .app-logo.solid{background:#0891b2; box-shadow:0 1px 2px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.12);}
    .app-logo.outline{background:transparent; color:#06b6d4; border:1.5px solid #06b6d4;}
    .dark .app-logo.outline{color:#22d3ee; border-color:#22d3ee; background:rgba(34,211,238,.08);}
    .app-logo.duotone{background:linear-gradient(135deg,#8b5cf6 0%,#06b6d4 100%); color:#fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);}
    .app-logo svg{width:22px;height:22px;stroke:currentColor}
    header .btn-ghost{width:42px;height:42px;padding:0;border-radius:calc(var(--radius) + 6px);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
    header .btn-ghost:hover{background:color-mix(in srgb, var(--muted) 70%, transparent)}
    .glass-header{background:color-mix(in srgb, var(--card) 72%, transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
    html.dark .glass-header{background:color-mix(in srgb, var(--card) 58%, transparent)}
    :root { --headline-h: 76px; }
    .card-headline{height: var(--headline-h); padding-bottom:.5rem; margin-bottom:.75rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:.75rem;}
    .card-headline .title{display:flex; align-items:center; gap:.6rem;}
    .card-headline .actions{display:flex; align-items:center; gap:1rem; white-space:nowrap;}
    @media (max-width: 640px){
      .card-headline{height:auto; align-items:flex-start;}
      .card-headline .actions{flex-wrap:wrap; white-space:normal;}
    }
    .day-pill.active{background:var(--primary-soft);color:#fff;border-color:transparent}
    .field-label{font-size:.75rem;color:var(--muted-foreground);margin-bottom:.25rem}
    .collapse-btn{border-radius:calc(var(--radius) - 2px);}
    /* Style for repetition input boxes: apply consistent border, rounded corners and internal padding */
    .reps-input {
      color: var(--foreground);
      text-align: center;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px);
      padding-left: 0.75rem;
      padding-right: 0.75rem;
      background: var(--input-background);
    }
    .reps-input::placeholder { color: var(--muted-foreground); opacity:.7; }
  
  /* Form fields follow the theme. :where() keeps specificity at zero, so .input, .reps-input and utility classes still win. */
  html.dark { color-scheme: dark; }   /* dark date picker, scrollbars, spinners */
  :where(input[type="text"], input[type="number"], input[type="date"], select, textarea) { color: var(--foreground); }
  :where(.dark) :where(input[type="text"], input[type="number"], input[type="date"], select, textarea) { background-color: var(--input-background); }

  /* Phones: brand + theme/backup buttons on the first row, tabs full width on the second */
  @media (max-width: 639px) {
    header .hdr-row { flex-wrap: wrap; row-gap: .6rem; padding-top: .6rem; padding-bottom: .6rem; }
    header .hdr-brand { flex: 1 1 0; min-width: 0; }
    header .hdr-title { min-width: 0; }
    header .hdr-title p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header .hdr-right { display: contents; }
    header .hdr-actions { order: 2; gap: .5rem; flex-shrink: 0; }
    header .hdr-tabs { order: 3; display: flex; width: 100%; }
    header .hdr-tabs .tab-trigger { flex: 1 1 0; justify-content: center; }
    .btn-outline { white-space: nowrap; }
    button.h-9, input.h-9 { height: 44px; }
    button.h-8 { height: 40px; }
    button.h-9.w-9 { width: 44px; }
    button.btn-outline.h-6 { height: 32px; padding: 0 .75rem; }
    .reps-input { height: 44px; }
    .day-strip { display: grid !important; grid-template-columns: repeat(7, 1fr); gap: 6px !important; }
    .day-strip .day-pill { min-width: 0; width: 100%; height: 42px; padding: 0; position: relative; }
    .day-strip .day-pill .dot { position: absolute; bottom: 5px; left: 50%; margin: 0; transform: translateX(-50%); }
    .card-headline { flex-wrap: wrap; }
    .card-headline .actions { min-width: 0; max-width: 100%; }
    .select-trigger { max-width: 100%; min-width: 0; }   /* long option labels no longer stretch the page */
  }
</style>

<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useRef } = React;

    /* Components */
    const Card = ({ children, className = "", ...props }) => (
      <div className={`card hover-lift ${className}`} {...props}>{children}</div>
    );
    const Button = ({ children, variant = "primary", size = "default", className = "", onClick, disabled, ...props }) => {
      const variants = { primary: "btn-primary", success: "btn-success", warning: "btn-warning", danger: "btn-danger", ghost: "btn-ghost", outline: "btn-outline" };
      const sizes = { default: "h-10 px-4 py-2", sm: "h-8 rounded-md px-3 text-sm", lg: "h-11 rounded-md px-8" };
      return (<button className={`inline-flex items-center justify-center rounded-md text-sm font-medium transition-all focus-visible:outline-none focus-visible:ring-2 ${variants[variant]} ${sizes[size]} ${className}`} onClick={onClick} disabled={disabled} {...props}>{children}</button>);
    };
    const IconBtn = ({title,onClick,children}) => (<button title={title} className="btn-outline h-8 w-8 rounded-md flex items-center justify-center" onClick={onClick}>{children}</button>);
    const Input = React.forwardRef((p, ref) => <input ref={ref} className={`input ${p.className||''}`} {...p}/>);
    Input.displayName = 'Input';
    const Switch = ({ checked, onChange, className = "" }) => (
      <label className={`switch ${className}`}><input type="checkbox" checked={checked} onChange={(e)=>onChange?.(e.target.checked)} /><span className="slider"></span></label>
    );
    // One pip per planned set (falls back to a plain bar for very high targets)
    const SetPips = ({ done, total }) => {
      if (!(total >= 1 && total <= 24)) return <Progress value={total > 0 ? (done / total) * 100 : 0}/>;
      return (
        <div className="set-pips" role="img" aria-label={`${done} of ${total} sets completed`}>
          {Array.from({ length: total }, (_, i) => <span key={i} className={i < done ? 'on' : ''}/>)}
        </div>
      );
    };
    const Progress = ({ value }) => (<div className="progress-container"><div className="progress-bar" style={{width: `${Math.min(100,Math.max(0,value))}%`}}/></div>);

    // Rest Timer Card: provides a customizable countdown timer for rest periods between sets.
    //
    // The timer state (duration, remaining, running) is scoped within this component so that the countdown
    // interval does not cause the entire app to re-render.  This component is memoized with React.memo
    // to preserve its state across parent renders.  Without memoization and defining the component at
    // the module scope, React would treat a re-declared function as a new component on each render and
    // unmount the previous timer, resetting its state.  See the dashboard usage for placement.
    const RestTimerCard = React.memo(() => {
      // Load persisted duration from localStorage or default to 150 seconds (2:30)
      const [duration, setDuration] = useState(() => {
        try {
          const stored = localStorage.getItem('patrick-minimal-v12:timer-duration');
          return stored ? Number(stored) : 150;
        } catch {
          return 150;
        }
      });
      // Remaining seconds for the countdown; initialise to the chosen duration
      const [remaining, setRemaining] = useState(() => duration);
      const [running, setRunning] = useState(false);
      const intervalRef = useRef(null);

      // Persist the chosen duration whenever it changes.  Also update the remaining time
      // if the timer is not currently running, so editing the duration resets the next start.
      useEffect(() => {
        try {
          localStorage.setItem('patrick-minimal-v12:timer-duration', String(duration));
        } catch {
          /* ignore */
        }
        if (!running) setRemaining(duration);
      }, [duration]);

      // Manage the countdown interval when running
      useEffect(() => {
        if (!running) return;
        intervalRef.current = setInterval(() => {
          setRemaining(prev => {
            if (prev <= 1) {
              clearInterval(intervalRef.current);
              intervalRef.current = null;
              setRunning(false);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => {
          if (intervalRef.current) clearInterval(intervalRef.current);
        };
      }, [running]);

      // Format seconds into MM:SS for display
      const format = (sec) => {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };
      // Start the timer; if it has reached zero then reset remaining to the duration first
      const start = () => {
        if (remaining === 0) setRemaining(duration);
        setRunning(true);
      };
      const pause = () => {
        setRunning(false);
      };
      const reset = () => {
        setRunning(false);
        setRemaining(duration);
      };
      return (
        <Card className="p-6 space-y-4 w-full h-full">
          <div className="card-headline">
            <div className="title">
              <span className="text-xl">⏱️</span>
              <h3 className="text-lg font-semibold">Rest Timer</h3>
            </div>
          </div>
          <div className="flex flex-col sm:flex-row sm:flex-wrap items-center gap-3">
            {/* Use a native number input for the timer field for consistent padding and styling. */}
            <input
              type="number"
              className="input h-9 w-24"
              value={duration}
              onChange={e => setDuration(Math.max(0, Number(e.target.value) || 0))}
              placeholder="Sec"
              style={{
                background: 'var(--input-background)',
                color: 'var(--foreground)',
                paddingLeft: '0.75rem',
                paddingRight: '0.75rem'
              }}
            />
            <Button size="sm" onClick={start}>Start</Button>
            <Button size="sm" variant="outline" onClick={pause}>Pause</Button>
            <Button size="sm" variant="outline" onClick={reset}>Reset</Button>
          </div>
          <div className="text-center text-4xl font-bold">{format(remaining)}</div>
        </Card>
      );
    });

    /* Icons */
    const Target=({className="",size=20})=> (<svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>);
    const TrendingUp=({className="",size=20})=>(<svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>);

    const Download=({size=16})=>(<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>);
    const Broom=({size=16})=>(<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 15l8-8"/><path d="M9 7l8 8"/><path d="M14 12l6 6"/><path d="M3 21l6-6"/></svg>);
    const Caret=({dir='down',size=14})=>(<svg width={size} height={size} viewBox='0 0 24 24' fill='none' stroke='currentColor' strokeWidth='2'><polyline points={dir==='down'?'6 9 12 15 18 9':'18 15 12 9 6 15'} /></svg>);

    /* ── Real date axis for the daily weight chart ─────────────────────────── */
    const DAY_MS = 86400000;
    const isoToDayNum = (iso) => { const [y, m, d] = iso.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY_MS); };
    const fmtDayNum = (n, opts) => new Date(n * DAY_MS).toLocaleDateString(navigator.language, { timeZone: 'UTC', ...opts });
    // Tick positions (day numbers) for a date axis: every day / 2 days, then Mondays / every other Monday, then 1st of month(s).
    const niceDateTicks = (minDay, maxDay, target = 9) => {
      const span = maxDay - minDay;
      const lo = Math.ceil(minDay);
      const ticks = [];
      const dayStep = [1, 2, 7, 14].find(st => span / st <= target);
      if (dayStep) {
        let d = lo;
        if (dayStep >= 7) d = lo + ((4 - (lo % 7) + 7) % 7);   // day 0 = Thu 1 Jan 1970, so Mondays are day % 7 === 4
        for (; d <= maxDay; d += dayStep) ticks.push(d);
        return { ticks, monthly: false };
      }
      const monthStep = [1, 2, 3, 6, 12, 24].find(st => span / 30.44 / st <= target) || 60;
      const first = new Date(lo * DAY_MS);
      for (let idx = first.getUTCFullYear() * 12 + first.getUTCMonth(); ; idx++) {
        const day = Date.UTC(Math.floor(idx / 12), idx % 12, 1) / DAY_MS;
        if (day > maxDay) break;
        if (day >= minDay && idx % monthStep === 0) ticks.push(day);
      }
      return { ticks, monthly: true };
    };

    /* ── Backup & restore ───────────────────────────────────────────────────
       A backup is one JSON file holding every localStorage key the app owns. Restoring replaces all
       current data with the file's content (validated first, rolled back if writing fails). */
    const BACKUP = {
      APP: 'fitness-tracker',
      FORMAT: 1,
      LAST_KEY: 'patrick-minimal-v12:last-backup',   // bookkeeping only, never part of a backup
      KEYS: { state: 'patrick-minimal-v12', logs: 'patrick-minimal-v12:log', exercises: 'patrick-minimal-v12:exercises', weights: 'patrick-minimal-v12:weights' },
      MAX_BYTES: 10 * 1024 * 1024
    };
    const isBackupKey = (k) => k !== BACKUP.LAST_KEY && (k === 'patrick-theme' || k.startsWith('patrick-minimal-v12'));
    const collectBackup = () => {
      const data = {};
      Object.keys(localStorage).filter(isBackupKey).sort().forEach(k => {
        const raw = localStorage.getItem(k);
        try { data[k] = { json: JSON.parse(raw) }; } catch { data[k] = { raw }; }
      });
      return { app: BACKUP.APP, format: BACKUP.FORMAT, exportedAt: new Date().toISOString(), data };
    };
    const downloadBackup = () => {
      const backup = collectBackup();
      const now = new Date(), pad = (n) => String(n).padStart(2, '0');
      const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `fitness-tracker-backup-${stamp}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      try { localStorage.setItem(BACKUP.LAST_KEY, backup.exportedAt); } catch {}
      return backup.exportedAt;
    };
    const summarizeBackupData = (values) => {
      const w = values[BACKUP.KEYS.weights], l = values[BACKUP.KEYS.logs];
      return {
        weights: Array.isArray(w) ? w.length : 0,
        weeks: Array.isArray(l) ? l.filter(x => x && Array.isArray(x.entries) && x.entries.length > 0).length : 0
      };
    };
    const parseBackup = (text) => {
      const fail = (error) => ({ ok: false, error });
      let env;
      try { env = JSON.parse(text); } catch { return fail("That file isn't valid JSON."); }
      if (!env || env.app !== BACKUP.APP || !env.data || typeof env.data !== 'object' || Array.isArray(env.data)) return fail("That doesn't look like a Fitness Tracker backup file.");
      if (!Number.isInteger(env.format) || env.format > BACKUP.FORMAT) return fail('This backup was made by a newer version of the app and cannot be read.');
      const entries = {};
      Object.entries(env.data).forEach(([k, cell]) => {
        if (!isBackupKey(k) || !cell || typeof cell !== 'object') return;
        if ('json' in cell) entries[k] = { json: cell.json };
        else if (typeof cell.raw === 'string') entries[k] = { raw: cell.raw };
      });
      if (Object.keys(entries).length === 0) return fail('This backup file contains no data.');
      let dropped = 0;
      const W = entries[BACKUP.KEYS.weights];
      if (W) {
        if (!Array.isArray(W.json)) return fail('The weight data in this backup is damaged.');
        const clean = [];
        W.json.forEach((e, i) => {
          const ok = e && typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date)
            && (typeof e.weight === 'number' || (typeof e.weight === 'string' && e.weight.trim() !== ''))
            && Number.isFinite(Number(e.weight)) && Number(e.weight) > 0;
          if (ok) clean.push({ ...e, id: e.id || `restored-${i}`, weight: Number(e.weight) }); else dropped++;
        });
        W.json = clean;
      }
      const L = entries[BACKUP.KEYS.logs];
      if (L && !(Array.isArray(L.json) && L.json.every(x => x && typeof x.weekOf === 'string' && Array.isArray(x.entries)))) return fail('The workout log in this backup is damaged.');
      const S = entries[BACKUP.KEYS.state];
      if (S) {
        if (!S.json || typeof S.json !== 'object' || Array.isArray(S.json)) return fail('The settings in this backup are damaged.');
        const { weekOf, viewDate, ...rest } = S.json;   // which week you were looking at isn't data: open on the current week
        S.json = rest;
      }
      const X = entries[BACKUP.KEYS.exercises];
      if (X && !Array.isArray(X.json)) return fail('The exercise list in this backup is damaged.');
      const values = {};
      Object.entries(entries).forEach(([k, c]) => { values[k] = 'json' in c ? c.json : c.raw; });
      return { ok: true, entries, exportedAt: typeof env.exportedAt === 'string' ? env.exportedAt : null, summary: summarizeBackupData(values), dropped, weightsList: W ? W.json : null, logsList: L ? L.json : null };
    };
    const applyBackup = (entries) => {
      const snapshot = {};
      Object.keys(localStorage).filter(isBackupKey).forEach(k => { snapshot[k] = localStorage.getItem(k); });
      try {
        Object.keys(snapshot).forEach(k => localStorage.removeItem(k));
        Object.entries(entries).forEach(([k, c]) => localStorage.setItem(k, 'json' in c ? JSON.stringify(c.json) : c.raw));
        return { ok: true };
      } catch (e) {
        try {   // put the old data back
          Object.keys(localStorage).filter(isBackupKey).forEach(k => localStorage.removeItem(k));
          Object.entries(snapshot).forEach(([k, v]) => localStorage.setItem(k, v));
        } catch {}
        return { ok: false, error: 'Could not write the restored data (browser storage is full or blocked). Your existing data was kept.' };
      }
    };

    /* Merge a backup into the current data instead of replacing it. Never deletes anything.
       Weights are matched by date (the backup's value wins on a clash); workout entries are matched by id.
       Settings, exercises and the theme stay as they are on this device. */
    const mergeBackupData = (curWeights, curLogs, bkWeights, bkLogs) => {
      const stats = { addedWeights: 0, changedDates: 0, addedEntries: 0, newWeeks: 0 };
      let weights = curWeights.slice();
      if (Array.isArray(bkWeights)) {
        const byDate = new Map();
        bkWeights.forEach(e => { if (!byDate.has(e.date)) byDate.set(e.date, []); byDate.get(e.date).push(e); });
        const sig = (a) => a.map(e => Number(e.weight)).sort((x, y) => x - y).join(',');
        byDate.forEach((list, date) => {
          const cur = weights.filter(e => e.date === date);
          if (cur.length === 0) { weights = weights.concat(list); stats.addedWeights += list.length; return; }
          if (sig(cur) === sig(list)) return;                       // already identical
          weights = weights.filter(e => e.date !== date).concat(list);
          stats.changedDates += 1;
        });
      }
      const logs = curLogs.map(w => ({ ...w, entries: (w.entries || []).slice() }));
      if (Array.isArray(bkLogs)) {
        const sigOf = (e) => [e.date, e.ex, e.reps, e.type].join('|');
        const ids = new Set(), noIdSigs = new Set();
        logs.forEach(w => w.entries.forEach(e => { if (!e) return; if (e.id) ids.add(e.id); else noIdSigs.add(sigOf(e)); }));
        bkLogs.forEach(bw => {
          const incoming = (bw.entries || []).filter(e => {
            if (!e) return false;
            if (e.id) { if (ids.has(e.id)) return false; ids.add(e.id); return true; }
            const sg = sigOf(e); if (noIdSigs.has(sg)) return false; noIdSigs.add(sg); return true;
          });
          let w = logs.find(x => x.weekOf === bw.weekOf);
          if (!w) { if (incoming.length === 0 && !bw.deload) return; w = { ...bw, entries: [] }; logs.push(w); stats.newWeeks += 1; }
          else if (bw.deload && !w.deload) w.deload = true;
          w.entries.push(...incoming); stats.addedEntries += incoming.length;
        });
      }
      return { weights, logs, stats };
    };
    const describeMerge = (st) => {
      const parts = [];
      if (st.addedWeights) parts.push(`${st.addedWeights} weight ${st.addedWeights === 1 ? 'entry' : 'entries'} added`);
      if (st.changedDates) parts.push(`${st.changedDates} ${st.changedDates === 1 ? 'date' : 'dates'} updated with the backup's weight`);
      if (st.addedEntries) parts.push(`${st.addedEntries} workout ${st.addedEntries === 1 ? 'entry' : 'entries'} added`);
      return parts.length ? 'Merged: ' + parts.join(', ') + '.' : 'Nothing new to merge. This device already has everything in that backup.';
    };

    // Reads a JSON value from localStorage. If it exists but can't be read (or has the wrong shape), a copy is kept under
    // "<key>:corrupt-<time>" before the app's own default is used, so the persist effects can't silently destroy it.
    const readStored = (key, isValid, fallback) => {
      let raw = null;
      try { raw = localStorage.getItem(key); } catch { return fallback; }
      if (raw === null) return fallback;
      try { const v = JSON.parse(raw); if (isValid(v)) return v; } catch {}
      try { localStorage.setItem(`${key}:corrupt-${Date.now()}`, raw); } catch {}
      console.error('Saved data under ' + key + ' was unreadable; a copy was kept.');
      return fallback;
    };

    const App = () => {
      /* Defaults (used to seed editable exercises) */
      const DEFAULT_TARGETS = { pull: 12, push: 12, vertical: 9, legs: 12, core: 9 };
      const DEFAULT_NAMES   = {
        pull:'Pull-ups / KB Row',
        push:'Dips / Hard Push-ups',
        vertical:'Vertical Push (Pike / OHP)',
        legs:'Legs (Goblet OR Assisted Pistols)',
        core:'Hanging Leg Raises'
      };
      const ICONS = { pull:'💪', push:'🤲', vertical:'⬆️', legs:'🦵', core:'💎', swings:'🔥', default:'🏋️' };

      const CONSTANTS = {
        STORAGE_KEY: 'patrick-minimal-v12',
        LOG_STORAGE_KEY: 'patrick-minimal-v12:log',
        THEME_STORAGE_KEY: 'patrick-theme',
        EXERCISES_KEY: 'patrick-minimal-v12:exercises',
        LOGO_STYLES: ['soft','solid','outline','duotone'],
        LOGO_GLYPHS: ['trend','ring'],
        // Key for persisting weight tracker entries
        WEIGHTS_KEY: 'patrick-minimal-v12:weights',
        // Key for remembering the weight chart view (daily / weekly)
        WEIGHT_VIEW_KEY: 'patrick-minimal-v12:weight-view',
      };

      /* State */
      const [activeTab, setActiveTab] = useState('dashboard');
      const [state, setState] = useState({
        weekOf: '', frequency: '3x', notes: '', hingePhase: 1, showSwings: false, theme: 'system', viewDate: '', logoGlyph:'trend', logoStyle:'soft',
        exercises: null, // [{key, name, target}]
      });
      const [logs, setLogs] = useState(() => readStored(CONSTANTS.LOG_STORAGE_KEY, Array.isArray, []));
      const [openHinge, setOpenHinge] = useState(false);

      // Weight tracker entries
      const [weights, setWeights] = useState(() => readStored(CONSTANTS.WEIGHTS_KEY, Array.isArray, []));

      // Backup & restore dialog
      const [backupOpen, setBackupOpen] = useState(false);
      const [backupMsg, setBackupMsg] = useState(null);   // { kind: 'ok' | 'error', text }
      const [lastBackup, setLastBackup] = useState(() => { try { return localStorage.getItem(BACKUP.LAST_KEY); } catch { return null; } });
      const backupFileRef = useRef(null);
      const [pendingRestore, setPendingRestore] = useState(null);   // { res, when } while a chosen file awaits Merge / Replace / Cancel
      const [storagePersisted, setStoragePersisted] = useState(null); // null = browser can't tell
      const requestPersist = async () => {
        try {
          if (!(navigator.storage && navigator.storage.persist)) return;
          const already = navigator.storage.persisted ? await navigator.storage.persisted() : false;
          setStoragePersisted(already || !!(await navigator.storage.persist()));
        } catch {}
      };
      useEffect(() => { requestPersist(); }, []);
      const trainingWeeks = logs.filter(w => w && w.entries && w.entries.length > 0).length;
      const backupAgeDays = (() => { const t = lastBackup ? new Date(lastBackup).getTime() : NaN; return Number.isFinite(t) ? Math.max(0, Math.floor((Date.now() - t) / 86400000)) : null; })();
      // Nudge (dot on the header button) once there is data and no backup in the last 30 days.
      const backupDue = (weights.length > 0 || trainingWeeks > 0) && (backupAgeDays === null || backupAgeDays >= 30);
      const openBackup = () => { setBackupMsg(null); setPendingRestore(null); setBackupOpen(true); requestPersist(); };
      useEffect(() => {
        if (!backupOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') setBackupOpen(false); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [backupOpen]);
      const handleExportBackup = () => {
        try {
          setLastBackup(downloadBackup());
          setBackupMsg({ kind: 'ok', text: 'Backup downloaded. Keep the file somewhere outside this browser, e.g. a cloud drive or USB stick.' });
        } catch (e) {
          setBackupMsg({ kind: 'error', text: 'Could not create the backup: ' + e.message });
        }
      };
      const handleRestoreFile = async (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';   // lets you pick the same file again later
        if (!file) return;
        if (file.size > BACKUP.MAX_BYTES) { setBackupMsg({ kind: 'error', text: 'That file is too large to be a backup.' }); return; }
        let text;
        try { text = await file.text(); } catch { setBackupMsg({ kind: 'error', text: 'Could not read that file.' }); return; }
        const res = parseBackup(text);
        if (!res.ok) { setBackupMsg({ kind: 'error', text: res.error }); return; }
        const when = res.exportedAt && !Number.isNaN(new Date(res.exportedAt).getTime())
          ? new Date(res.exportedAt).toLocaleString(navigator.language, { dateStyle: 'medium', timeStyle: 'short' }) : 'an unknown date';
        setBackupMsg(null);
        setPendingRestore({ res, when });
      };
      const doMerge = () => {
        if (!pendingRestore) return;
        const m = mergeBackupData(weights, logs, pendingRestore.res.weightsList, pendingRestore.res.logsList);
        setWeights(m.weights); setLogs(m.logs);
        setPendingRestore(null);
        setBackupMsg({ kind: 'ok', text: describeMerge(m.stats) });
      };
      const doReplace = () => {
        if (!pendingRestore) return;
        if (!window.confirm('Replace everything currently in the app with this backup?\n\nThis cannot be undone.')) return;
        const done = applyBackup(pendingRestore.res.entries);
        if (!done.ok) { setPendingRestore(null); setBackupMsg({ kind: 'error', text: done.error }); return; }
        window.location.reload();
      };
      // Rest timer state lives inside the RestTimerCard component so that updates to the
      // countdown do not re‑render the entire App.  Keeping the timer state scoped
      // locally prevents the countdown interval from stealing focus from other inputs.

      /* Date helpers */
      const toISO=(d)=>{const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
      const isoToday=()=>toISO(new Date());
      const addDays=(iso,delta)=>{const d=new Date(iso||isoToday());d.setDate(d.getDate()+delta);d.setHours(0,0,0,0);return toISO(d)};
      const startOfISOWeek=(dateStr)=>{const d=dateStr?new Date(dateStr):new Date();const day=d.getDay();const diff=(day===0?-6:1)-day;d.setDate(d.getDate()+diff);d.setHours(0,0,0,0);return toISO(d)};
      const getWeekDays=(weekStartISO)=>{const labels=['M','T','W','T','F','S','S'];return Array.from({length:7},(_,i)=>{const iso=addDays(weekStartISO,i);return{label:labels[i],date:iso,isToday:iso===isoToday()}})};
      const weekEnd=(weekStartISO)=> addDays(weekStartISO,6);
      const clampToWeek=(isoDate, weekStartISO)=>{ const start=weekStartISO; const end=weekEnd(weekStartISO); if(isoDate<start) return start; if(isoDate>end) return end; return isoDate; };
      const formatDisplayDate=(isoDate)=>{const d=new Date(isoDate);const userTimezoneOffset=d.getTimezoneOffset()*60000;const adjustedDate=new Date(d.getTime()+userTimezoneOffset);return adjustedDate.toLocaleDateString(navigator.language,{weekday:'short',day:'numeric',month:'short'})};

      /* Persistence */
      useEffect(()=>{
        try{
          const s = localStorage.getItem(CONSTANTS.STORAGE_KEY); if(s) setState(p=>({...p,...JSON.parse(s)}));
          
          const t = localStorage.getItem(CONSTANTS.THEME_STORAGE_KEY); if(t) setState(p=>({...p,theme:t}));
        }catch(e){console.error("Failed to load state from localStorage", e)}
      },[]);

      // Init week/view + exercises list (seed from defaults if missing)
      useEffect(()=>{
        setState(p=>{
          const weekOf = startOfISOWeek(p.weekOf||isoToday());
          const viewDate = p.viewDate||isoToday();
          let exercises = p.exercises;
          if(!exercises){
            let saved = null;
            try{ saved = localStorage.getItem(CONSTANTS.EXERCISES_KEY); }catch(e){ console.error('Failed to read exercises from localStorage', e); }
            let parsed = null;
            if(saved){
              try{ parsed = JSON.parse(saved); }catch(e){ console.error('Corrupted exercises data in localStorage, resetting to defaults', e); }
            }
            if(parsed){ exercises = parsed; }
            else{
              exercises = Object.keys(DEFAULT_TARGETS).map(k=>({key:k, name:DEFAULT_NAMES[k], target:DEFAULT_TARGETS[k]}));
            }
          }
          return {...p, weekOf, viewDate, exercises};
        });
      },[]);

      useEffect(()=>{ try{localStorage.setItem(CONSTANTS.STORAGE_KEY, JSON.stringify(state));}catch{} },[state]);
      useEffect(()=>{ try{localStorage.setItem(CONSTANTS.LOG_STORAGE_KEY, JSON.stringify(logs));}catch{} },[logs]);
      useEffect(()=>{ try{ if(state.exercises) localStorage.setItem(CONSTANTS.EXERCISES_KEY, JSON.stringify(state.exercises)); }catch{} },[state.exercises]);

      // Persist weights whenever they change
      useEffect(() => {
        try { localStorage.setItem(CONSTANTS.WEIGHTS_KEY, JSON.stringify(weights)); } catch {
          /* ignore */
        }
      }, [weights]);

      /* Logic effects */
      useEffect(()=>{
        if(!state.weekOf || !state.viewDate) return;
      
        const selectedWeekStart = startOfISOWeek(state.weekOf);
        const currentWeekStart = startOfISOWeek(isoToday());
      
        let newViewDate;
      
        if (selectedWeekStart === currentWeekStart) {
          // If viewing the current week, automatically select today's date.
          newViewDate = isoToday();
        } else {
          // For other weeks, try to preserve the day of the week.
          // This prevents jumping to the start/end of the week when navigating.
          const oldViewDate = new Date(state.viewDate);
          // Adjust for timezone to get the correct day index relative to UTC
          const oldViewDateUTC = new Date(oldViewDate.valueOf() + oldViewDate.getTimezoneOffset() * 60000);
          const dayOfWeek = oldViewDateUTC.getUTCDay(); // 0=Sunday, 1=Monday
          const dayIndex = dayOfWeek === 0 ? 6 : dayOfWeek - 1; // 0=Monday, ... 6=Sunday
          newViewDate = addDays(selectedWeekStart, dayIndex);
        }
      
        // Only update state if the viewDate needs to change to avoid unnecessary re-renders.
        if (newViewDate !== state.viewDate) {
          setState(p => ({ ...p, viewDate: newViewDate }));
        }
      }, [state.weekOf]);
      useEffect(()=>{ if(!state.weekOf) return; const ws=startOfISOWeek(state.weekOf); if(!logs.find(w=>w.weekOf===ws)){ setLogs(prev=>[...prev,{weekOf:ws,deload:false,entries:[]}]); } }, [state.weekOf]);
      useEffect(()=>{
        const applyTheme=(theme)=>{const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;const isDark=theme==='dark'||(theme==='system'&&prefersDark);document.documentElement.classList.toggle('dark', isDark)};
        applyTheme(state.theme); try{ localStorage.setItem(CONSTANTS.THEME_STORAGE_KEY,state.theme); }catch(e){ console.error('Failed to persist theme', e); }
      },[state.theme]);

      /* Helpers & mutations */
      const getWeek=(weekOf,create=true)=>{let w=logs.find(x=>x.weekOf===weekOf); if(!w && create){w={weekOf, deload:false, entries:[]}; setLogs(p=>[...p,w]);} return w};
      const weekSetCounts=(week)=>{
        const counts = Object.fromEntries((state.exercises||[]).map(e=>[e.key,0]));
        if(!week) return counts;
        week.entries.forEach(e=>{ if(e.type==='set' && (e.ex in counts)){ counts[e.ex]+=1; }});
        return counts;
      };
      const overallProgress=(week)=>{
        const counts=weekSetCounts(week);
        const totalTarget=(state.exercises||[]).reduce((a,b)=>a+(Number(b.target)||0),0);
        const totalCurrent=(state.exercises||[]).reduce((a,e)=>a+(counts[e.key]||0),0);
        return totalTarget>0? Math.round((totalCurrent/totalTarget)*100) : 0;
      };
      const addSet=(exercise,delta)=>{
        const wk=startOfISOWeek(state.weekOf||isoToday());
        if (delta > 0) {
          const newEntry={id:(Date.now()+Math.random()).toString(36), date: isoToday(), ex:exercise, reps:0, type:'set'};
          setLogs(prev => {
            const idx = prev.findIndex(w => w.weekOf === wk);
            if (idx === -1) return [...prev, { weekOf: wk, deload: false, entries: [newEntry] }];
            const copy = [...prev]; copy[idx] = { ...copy[idx], entries: [...copy[idx].entries, newEntry] }; return copy;
          });
        } else {
          setLogs(prev=>prev.map(w=>{
            if(w.weekOf!==wk) return w;
            const idx=[...w.entries].map((e,i)=>({e,i})).reverse().find(x=>x.e.type==='set' && x.e.ex===exercise)?.i;
            if(idx===undefined) return w; const copy=[...w.entries]; copy.splice(idx,1); return {...w, entries:copy};
          }));
        }
      };
      const addReps=(exercise,reps)=>{
        const wk=startOfISOWeek(state.weekOf||isoToday());
        if(!reps || reps <= 0) return;
        const newEntry={id:(Date.now()+Math.random()).toString(36), date:state.viewDate||isoToday(), ex:exercise, reps, type:'reps'};
        setLogs(prev => {
          const idx = prev.findIndex(w => w.weekOf === wk);
          if (idx === -1) return [...prev, { weekOf: wk, deload: false, entries: [newEntry] }];
          const copy = [...prev]; copy[idx] = { ...copy[idx], entries: [...copy[idx].entries, newEntry] }; return copy;
        });

      const deleteEntry=(id)=>{ setLogs(prev=>prev.map(w=>({...w, entries:w.entries.filter(e=>e.id!==id)}))); };
      const getDayEntries=()=>{ const day=state.viewDate||isoToday(); const wk=startOfISOWeek(state.weekOf||isoToday()); const week=getWeek(wk,false); if(!week) return []; return week.entries.filter(e=>e.type!=='set' && e.date===day).slice().reverse(); };
      const nameFor = (key)=> (state.exercises?.find(x=>x.key===key)?.name) || key;
      const iconFor = (key)=> ICONS[key] || ICONS.default;
      const addExerciseRow = ()=>{

        setState(p=>({...p, exercises:[...(p.exercises||[]), {key:id, name:'New exercise', target:10}]}));

      const updateExercise = (key, updates)=>{
        setState(p=>({...p, exercises:(p.exercises||[]).map(e=> e.key===key ? {...e, ...updates, target: Math.max(0, Number(updates.target ?? e.target)||0)} : e )}));

      const removeExercise = (key)=>{

        setState(p=>({...p, exercises:(p.exercises||[]).filter(e=>e.key!==key)}));

      // === Additional cards ===
      // Weight Tracker Card: allows logging and summarizing body weight over time (dashboard)
      const WeightTrackerCard = () => {
        // local state for weight logging inputs

        const handleAdd = () => {

        };
        return (
          <Card className="p-6 space-y-4 w-full h-full">
            <div className="card-headline">
              <div className="title">
                <span className="text-xl">⚖️</span>
                <h3 className="text-lg font-semibold">Weight Entry</h3>
              </div>
            </div>
            <div className="flex flex-col sm:flex-row sm:flex-wrap items-center gap-3">
              {/* using our Input component ensures consistent styling across themes */}
              {/* Use a native input element here so we have full control over styling. The `input` class
                  provides consistent styling across themes, while `px-3` gives horizontal padding.
                  Override the background to use `--input` instead of the default `--input-background`. */}

                type="date"

      // Weight tracker helpers
      // Add a new weight entry with an ISO date string and numeric weight (kg). Generates a unique id.
      // Rules for weight entries: one entry per date, plausible values only.
      const WEIGHT_MIN_KG = 30, WEIGHT_MAX_KG = 300;   // outside this range the value is rejected
      const WEIGHT_JUMP_KG = 4, WEIGHT_JUMP_DAYS = 7;  // a bigger change than this vs the nearest entry asks for confirmation
      // Returns { ok:false } when the entry must not be saved (invalid value, or the user declined a prompt).
      // Otherwise { ok:true, removeIds } where removeIds are the other entries on the same date that it replaces.
      const resolveWeightEntry = (date, weight, ignoreId = null) => {
        if (!date || !Number.isFinite(weight)) return { ok: false };
        if (weight < WEIGHT_MIN_KG || weight > WEIGHT_MAX_KG) {
          window.alert(`${weight} kg doesn't look right. Please enter a weight between ${WEIGHT_MIN_KG} and ${WEIGHT_MAX_KG} kg.`);
          return { ok: false };
        }
        const others = weights.filter(e => e.id !== ignoreId);
        const sameDay = others.filter(e => e.date === date);
        if (sameDay.length) {
          const old = sameDay.map(e => `${e.weight} kg`).join(', ');
          if (!window.confirm(`You already have ${old} logged for ${date}. Replace it with ${weight} kg?`)) return { ok: false };
        }
        // Typo guard: compare with the closest entry on another date.
        const t = new Date(date).getTime();
        let nearest = null, best = Infinity;
        others.forEach(e => {
          if (e.date === date) return;
          const d = Math.abs(new Date(e.date).getTime() - t);
          if (d < best) { best = d; nearest = e; }
        });
        if (nearest && best <= WEIGHT_JUMP_DAYS * 86400000 && Math.abs(weight - nearest.weight) > WEIGHT_JUMP_KG) {
          const diff = Math.abs(weight - nearest.weight).toFixed(1);
          if (!window.confirm(`${weight} kg is ${diff} kg ${weight > nearest.weight ? 'above' : 'below'} your entry from ${nearest.date} (${nearest.weight} kg). Save anyway?`)) return { ok: false };
        }
        return { ok: true, removeIds: sameDay.map(e => e.id) };
      };
      const addWeightEntry = (date, weight) => {
        const w = Number(weight);
        const res = resolveWeightEntry(date, w);
        if (!res.ok) return false;
        const newEntry = { id: (Date.now() + Math.random()).toString(36), date, weight: w };
        setWeights(prev => [...prev.filter(e => !res.removeIds.includes(e.id)), newEntry]);
        return true;
      };

      const deleteWeightEntry = (id) => {

                </span>

      /* Logged Entries (uses dynamic names/icons) */
      const LoggedEntriesCard = ()=> {
        const weekStart = startOfISOWeek(state.weekOf || isoToday());
        const week = getWeek(weekStart, false);
        const days = getWeekDays(weekStart);
        const hasEntryByDate = new Set((week?.entries || []).filter(e=>e.type!=='set').map(e => e.date));
        const workIdx = state.frequency === '6x' ? new Set([0,1,2,3,4,5]) : new Set([0,2,4]);

        return (
